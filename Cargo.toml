[package]
name = "handover-filter"
version = "0.1.0"
edition = "2024"

[dependencies]
constellation = { git = "https://github.com/IPNetworkingLab/constellation.git", version = "0.1.0" }

clap = { version = "4.6.1", features = ["derive"] }
